# Builds and publishes the extension when a version tag is pushed.
#
# The contract with Fontelle's Extensions page
# (`crates/fontelle-app/src/extensions.rs`) is two names: the archive is
# `fontelle-vst2-<version>-<target>` (`.tar.gz`, or `.zip` on Windows) and
# holds the bridge library named the way *that build of Fontelle* looks for it
# inside the archive (`Extension::library_name`):
#
#   x86_64-unknown-linux-gnu   libfontelle_vst2.so
#   x86_64-pc-windows-msvc     fontelle-vst2.dll      (cargo builds
#                                                       fontelle_vst2.dll; we
#                                                       rename it to the hyphen
#                                                       name Fontelle wants)
#   *-apple-darwin             libfontelle_vst2.dylib
#
# and `SHA256SUMS` sits beside them in `sha256sum` format. Fontelle reads this
# repository's `releases/latest`, verifies the checksum, unpacks the archive
# (`tar -xf`, which also reads a `.zip` on Windows), finds that file by name and
# renames it into its bridges folder. The four targets here are exactly the four
# `updates::target_triple` reports, so a Fontelle on any of them finds its asset.
#
# Publishing is a human gate (Ty's call): bump `version` in the workspace
# `Cargo.toml`, commit, then
#
#     git tag v0.1.1 && git push origin v0.1.1
#
# The first job refuses a tag that does not match the version in the tree.

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  version:
    name: The tag matches the crate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; ps=json.load(sys.stdin)["packages"]; print(next(p["version"] for p in ps if p["name"]=="fontelle-vst2"))')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu the runners offer, so the library's glibc floor is
          # as low as it can be: Linux is the point of this project.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: fontelle-vst2-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Prove the bridge on this OS before shipping it: the loader test opens the
      # fixture plugin — a real .so/.dll/.dylib — through the same code path
      # Fontelle uses. Native arch only (a cross target has nothing to run on).
      - name: Test (native arch)
        if: ${{ !(matrix.os == 'macos-latest' && matrix.target == 'x86_64-apple-darwin') }}
        run: cargo test --release --locked
      - name: Build the bridge
        run: cargo build --release --locked -p fontelle-vst2 --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/$NAME"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "target/${{ matrix.target }}/release/libfontelle_vst2.dylib" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/libfontelle_vst2.so" "dist/$NAME/"
          fi
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/$NAME/"
          tar -czf "$NAME.tar.gz" -C dist "$NAME"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/$env:NAME" | Out-Null
          # cargo names the cdylib fontelle_vst2.dll; Fontelle's install path
          # looks for the hyphenated fontelle-vst2.dll inside the archive.
          Copy-Item "target/${{ matrix.target }}/release/fontelle_vst2.dll" "dist/$env:NAME/fontelle-vst2.dll"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md "dist/$env:NAME/"
          Compress-Archive -Path "dist/$env:NAME" -DestinationPath "$env:NAME.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum fontelle-vst2-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: fontelle-vst2 ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/fontelle-vst2-*
            artifacts/SHA256SUMS
